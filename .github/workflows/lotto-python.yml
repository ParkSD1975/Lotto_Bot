name: Lotto Auto Update

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 6'  # 매주 토요일 21:35 KST (UTC 12:35)

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v3

      - name: 파이썬 설정하기 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치하기 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # 만약 requirements.txt에 아래 라이브러리가 없다면 직접 설치하도록 추가
          pip install requests beautifulsoup4 supabase

      - name: 로또 데이터 업데이트 실행 (Run Update Script)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # 파일명이 update_lotto.py인지 다시 한번 확인하세요.
          python update_lotto.py
