name: Lotto Auto Update

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 6'  # 매주 토요일 21:35 KST (기존 시간 유지)

jobs:
  update-db:
    runs-on: ubuntu-latest
    
    steps:
      - name: 저장소 코드 가져오기 (Checkout)
        uses: actions/checkout@v3

      - name: 파이썬 설정하기 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치하기 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # [수정됨] Fix 스크립트는 통합되었으므로 제거했습니다.
      # 바로 완전체 업데이트 스크립트를 실행합니다.
      - name: 완전체 업데이트 실행 (Run Full Update Script)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python update_lotto_db.py
